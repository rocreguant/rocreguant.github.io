#Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: Roc Reguant
url: 'http://rocreguant.github.io'
recipes_page_heading: "Recipes"
recipes_page_subtitle: "Les meves receptes d'estar per casa"

#change it according to your repository name
# disabling since we are using a custom domain
#baseurl: '/online-cv' 

description: Showing my personal website and blog. I am a software engineer, and I like to cook and share my recipes.
blog_paginate: 9
recipes_paginate: 9
collections:
  blog:
    output: true
    permalink: /blog/:title/
  recipes:
    output: true
    permalink: /recipes/:title/
defaults:
  - scope:
      path: ""
      type: blog
    values:
      layout: clean-blog-post
  - scope:
      path: ""
      type: recipes
    values:
      layout: mediumish-recipe
# Style will be applied only after restarting the build or serve. Just choose one of the options.
theme_skin: blue # blue turquoise green berry orange ceramic teal oceanstale
chrome_mobile_color: #use hex colors (ex:#1976d2) or leave empty if you don't want a color for chrome mobile searchbar

# Tracker
analytics: UA-83979019-1

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # http://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html: # - http://jch.penibelst.de/
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
