career-profile:
  title: Career Profile
  summary: |
    Accomplished biopharmaceutical leader with 10+ years of experience across Medical Affairs, real-world evidence (RWE), and advanced analytics. Proven track record in leading cross-functional teams, driving global medical strategies, and managing integrated evidence generation plans for complex therapeutic areas, including dermatology, metabolic, oncology, and neurology. Expert in collaborating with global/country affiliates, external medical experts, and KOLs to translate scientific insights into actionable medical strategies, HTA/reimbursement submissions, and product launch readiness.

