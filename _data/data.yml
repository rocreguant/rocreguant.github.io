experiences:
  title: Experiences
  info:
    - role: RWE Scientist Lead – Global Analytics & Medical Strategy
      time: 2024 - Present
      company: AstraZeneca, Barcelona, Spain
      details: |
        - Co-lead global medical strategy and evidence generation plans in close collaboration with Medical Affairs, Market Access, HEOR, and country affiliates to address key evidence gaps, optimize patient journey mapping, and accelerate launch readiness.
        - Engage proactively with key opinion leaders (KOLs) and external medical experts to align research initiatives with global medical needs, presenting real-world evidence at major scientific conferences.
        - Serve as the strategic partner for cross-functional Global Brand Teams, delivering data-driven medical insights to shape global brand tactics, value dossiers, and HTA/reimbursement strategy across priority assets.
        - Drive local medical affairs and affiliate excellence by providing strategic guidance, standardizing analytics frameworks, and upskilling regional teams to ensure consistent execution of global medical priorities.
        - Lead high-impact real-world data (RWD) projects using EHR and claims data to identify treatment patterns, unmet clinical needs, and underdiagnosed patient populations.
        - Manage multi-million Ex-US data acquisition strategies and external CRO partnerships, ensuring high-quality, on-time delivery of strategic scientific deliverables.
    - role: Machine Learning Solutions Architect
      time: 2022 - 2024
      company: CSIRO, Sydney, Australia
      details: |
        - Directed junior team members and led the end-to-end development of proteomics analysis platforms, focusing on automated feature extraction and synergy detection to advance precision medicine initiatives.
        - Architected VariantSpark, a cloud-based distributed ML tool for analyzing complex epistatic interactions; successfully developed polygenic risk scores for Cardiovascular (CV) risk, translating genomic complexity into actionable clinical predictors.
        - Lead a multi-modal data generation project to create high-fidelity synthetic datasets encompassing genetics, biochemistry, imaging (2D/3D), and clinical text.
        - Got granted a patent and lead the commercialization strategy for federated data generation.
    - role: R&D Scientist in Real-World Data
      time: 2018 - 2021
      company: Novo Nordisk Foundation Center for Protein Research, Copenhagen, Denmark
      details: |
        - Led the developed of Deep Learning (CNN) models for the automated grading of diabetic retinopathy, significantly improving lesion identification in large-scale biomedical imaging datasets.
        - Performed longitudinal patient journey mapping using large-scale EHR/EMR registries to stratify populations and differentiate complex disease states like Alzheimer’s vs. vascular dementia.
        - Executed advanced time-to-event mortality analyses across Danish national databases, identifying causal drivers.
        - Authored technical reports and collaborated on research initiatives that translated complex temporal data into actionable clinical insights.
    - role: Research fellow 
      time: 2016 - 2017
      company: Dana-Farber Cancer Institute, Boston, USA
      details: |
        - Developed a tool to analyze protein sequences to devise critical amino acid pairs correlations within the same protein family. Those pairs were regarded as critically relevant for the protein structure and function and thus a key element to identify homologs. 
        - JavaScript implementation of a webpage for protein alignment visualization (alignmentviewer.org).
    - role: Data Mining and Machine Learning Engineer 
      time: 2016 - 2016
      company: Arvato healthcare services, Munich, Germany
      details: |
        - Provided comprehensive analysis for pharmaceutical and insurance clients utilizing PostgreSQL, Python, and R.
        - Optimized patient clustering models for Multiple Sclerosis (MS) based on longitudinal treatment history to improve understanding of disease progression.
        - Engineered a high-performance patient similarity scoring algorithm capable of processing and analyzing records for millions of individuals in a production environment.


